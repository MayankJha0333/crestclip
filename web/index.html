<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CrestClip finds the moments viewers actually rewatch and turns them into ready-to-post vertical clips." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/logo-512.png" sizes="512x512" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-512.png" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // set light/dark before the page draws, so it never flashes the wrong colours
      (function () {
        var c = 'system';
        try { c = localStorage.getItem('crestclip-theme') || 'system'; } catch (e) {}
        var dark = c === 'dark' || (c === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>CrestClip — clip the moment everyone rewatches</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
